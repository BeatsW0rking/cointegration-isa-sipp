[project]
name = "cointisa"
version = "0.1.0"
description = "Reproducible cointegration research for long-only UK ISA/SIPP trading (Trading 212, Hargreaves Lansdown)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14.4",
  "pyarrow>=18",
  "pydantic>=2.9",
  "pyyaml>=6",
  "typer>=0.15",
  "httpx>=0.28",
  "yfinance>=0.2.50",
  "matplotlib>=3.9",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "hypothesis>=6"]

[project.scripts]
cointisa = "cointisa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cointisa"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
